default: true

# Line length - https://github.com/DavidAnson/markdownlint/blob/master/doc/Rules.md#md013---line-length
MD013:
  code_blocks: false
  tables: false

# Duplicate headings - https://github.com/DavidAnson/markdownlint/blob/master/doc/Rules.md#md024---multiple-headings-with-the-same-content
# CHANGELOG.md (generated by changesets) repeats "### Patch Changes" /
# "### Minor Changes" under every version heading — only flag duplicates
# that are actual siblings under the same parent.
MD024:
  siblings_only: true

# Do not enforce line length in markdown files
line_length: false
